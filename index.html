<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>برنامه‌ریز حرفه‌ای تکالیف و امتحانات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #eef2f6;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: rgba(79, 70, 229, 0.09);
      --exam: #7c3aed;
      --exam-hover: #6d28d9;
      --exam-soft: rgba(124, 58, 237, 0.09);
      --done: #10b981;
      --done-soft: rgba(16, 185, 129, 0.12);
      --progress: #f59e0b;
      --progress-soft: rgba(245, 158, 11, 0.13);
      --todo: #ef4444;
      --todo-soft: rgba(239, 68, 68, 0.11);
      --shadow-xs: 0 1px 3px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.07);
      --shadow-lg: 0 24px 64px rgba(15, 23, 42, 0.2);
      --radius: 18px;
      --radius-md: 13px;
      --radius-sm: 10px;
    }

    body.dark {
      --bg: #060913;
      --surface: #0e1526;
      --surface-2: #151f36;
      --surface-3: #1d2a45;
      --border: #233252;
      --text: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --primary-soft: rgba(99, 102, 241, 0.16);
      --exam: #a78bfa;
      --exam-hover: #c4b5fd;
      --exam-soft: rgba(167, 139, 250, 0.16);
      --done: #34d399;
      --done-soft: rgba(52, 211, 153, 0.14);
      --progress: #fbbf24;
      --progress-soft: rgba(251, 191, 36, 0.14);
      --todo: #f87171;
      --todo-soft: rgba(248, 113, 113, 0.14);
      --shadow-xs: 0 1px 4px rgba(0, 0, 0, 0.28);
      --shadow-sm: 0 6px 18px rgba(0, 0, 0, 0.32);
      --shadow-md: 0 14px 36px rgba(0, 0, 0, 0.42);
      --shadow-lg: 0 28px 70px rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      transition: background 0.25s ease, color 0.25s ease;
      padding-bottom: 64px;
    }

    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Header */
    .topbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 22px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }

    .topbar::after {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--exam), var(--done));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--exam));
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 22px rgba(79, 70, 229, 0.28);
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .brand p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .iran-clock {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--done);
      box-shadow: 0 0 0 4px var(--done-soft);
      animation: livePulse 2s infinite;
    }

    @keyframes livePulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.65; }
    }

    .clock-time {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
      direction: ltr;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .clock-date {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .theme-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.2s;
    }

    .theme-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    .tab-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text);
      transition: all 0.2s ease;
      box-shadow: var(--shadow-xs);
    }

    .tab-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .tab-left {
      display: flex;
      align-items: center;
      gap: 13px;
      text-align: right;
    }

    .tab-ico {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      transition: all 0.2s;
    }

    .tab-name {
      font-size: 1rem;
      font-weight: 800;
      display: block;
    }

    .tab-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .tab-count {
      background: var(--surface-3);
      color: var(--text-secondary);
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 800;
    }

    .tab-btn.active.homework {
      border-color: var(--primary);
      background: linear-gradient(135deg, var(--surface) 60%, var(--primary-soft));
    }

    .tab-btn.active.homework .tab-ico,
    .tab-btn.active.homework .tab-count {
      background: var(--primary);
      color: #fff;
    }

    .tab-btn.active.exam {
      border-color: var(--exam);
      background: linear-gradient(135deg, var(--surface) 60%, var(--exam-soft));
    }

    .tab-btn.active.exam .tab-ico,
    .tab-btn.active.exam .tab-count {
      background: var(--exam);
      color: #fff;
    }

    /* Analytics */
    .analytics-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 10px;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .panel-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .donut-wrap {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 20px;
      flex-wrap: wrap;
    }

    .donut-box {
      position: relative;
      width: 152px;
      height: 152px;
      flex-shrink: 0;
    }

    .donut-box svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .donut-track {
      fill: none;
      stroke: var(--surface-3);
      stroke-width: 15;
    }

    .donut-seg {
      fill: none;
      stroke-width: 15;
      transition: stroke-dasharray 0.55s ease, stroke-dashoffset 0.55s ease;
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .donut-percent {
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1.1;
    }

    .donut-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .donut-legend {
      flex: 1;
      min-width: 150px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
    }

    .legend-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .legend-val {
      font-weight: 800;
    }

    .chart-toggle {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 3px;
    }

    .chart-toggle button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chart-toggle button.active {
      background: var(--primary);
      color: #fff;
    }

    .bar-chart-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 152px;
      justify-content: center;
    }

    .bar-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .bar-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .bar-meta .muted {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.75rem;
    }

    .bar-track {
      height: 10px;
      background: var(--surface-3);
      border-radius: 999px;
      overflow: hidden;
      display: flex;
    }

    .bar-fill {
      height: 100%;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .bar-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.84rem;
      padding: 36px 10px;
    }

    /* Toolbar */
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }

    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-wrap input {
      padding-right: 38px;
    }

    .search-ico {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 11px;
      padding: 10px 12px;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .toolbar select {
      width: auto;
      min-width: 145px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.24);
      transition: all 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .btn-primary.exam-mode {
      background: linear-gradient(135deg, var(--exam), #9333ea);
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.24);
    }

    .btn-ghost {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 11px;
      padding: 9px 16px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-ghost:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Cards Grid */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(335px, 1fr));
      gap: 16px;
    }

    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 4px solid var(--todo);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .item-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .item-card.status-todo { border-top-color: var(--todo); }
    .item-card.status-in_progress { border-top-color: var(--progress); }
    .item-card.status-done { border-top-color: var(--done); opacity: 0.86; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .subject-tag {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      margin-bottom: 6px;
    }

    .item-card.type-exam .subject-tag {
      background: var(--exam-soft);
      color: var(--exam);
    }

    .card-title {
      font-size: 1.03rem;
      font-weight: 800;
      line-height: 1.45;
    }

    .item-card.status-done .card-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .priority-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .priority-high { background: var(--todo-soft); color: var(--todo); }
    .priority-medium { background: var(--progress-soft); color: var(--progress); }
    .priority-low { background: var(--done-soft); color: var(--done); }

    .card-desc {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .meta-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .meta-row .k { color: var(--text-muted); }
    .meta-row .v { font-weight: 700; }

    .countdown {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      text-align: center;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .countdown.overdue {
      background: var(--todo-soft);
      color: var(--todo);
    }

    .countdown.finished {
      background: var(--done-soft);
      color: var(--done);
    }

    /* 3-State Switcher */
    .status-switcher {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      background: var(--surface-2);
      padding: 4px;
      border-radius: 11px;
      border: 1px solid var(--border);
    }

    .status-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      padding: 7px 4px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
    }

    .status-btn:hover {
      color: var(--text);
    }

    .status-btn.active-todo {
      background: var(--todo);
      color: #fff;
      box-shadow: 0 3px 10px rgba(239, 68, 68, 0.25);
    }

    .status-btn.active-in_progress {
      background: var(--progress);
      color: #fff;
      box-shadow: 0 3px 10px rgba(245, 158, 11, 0.25);
    }

    .status-btn.active-done {
      background: var(--done);
      color: #fff;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.25);
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: auto;
    }

    .mini-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mini-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .mini-btn.danger:hover {
      background: var(--todo-soft);
      border-color: var(--todo);
      color: var(--todo);
    }

    .empty-state {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 56px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state h3 {
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 6px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 9, 19, 0.65);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      animation: modalIn 0.2s ease-out;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .close-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .date-time-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.25fr 0.85fr 0.95fr 0.95fr;
      gap: 6px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    @media (max-width: 860px) {
      .analytics-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      .tabs, .form-row { grid-template-columns: 1fr; }
      .date-time-grid { grid-template-columns: repeat(3, 1fr); }
      .items-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>

  <script>
    // ================== Jalali Calendar & Iran Official Time (UTC+03:30) ==================
    const JALALI_MONTHS = [
      'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
      'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'
    ];
    const PERSIAN_DAYS = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه', 'شنبه'];
    const IRAN_OFFSET_MS = 3.5 * 3600 * 1000;

    function gregorianToJalali(gy, gm, gd) {
      const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
      const gy2 = gm > 2 ? gy + 1 : gy;
      let days = 355666 + (365 * gy) + ~~((gy2 + 3) / 4) - ~~((gy2 + 99) / 100) + ~~((gy2 + 399) / 400) + gd + g_d_m[gm - 1];
      let jy = -1595 + (33 * ~~(days / 12053));
      days %= 12053;
      jy += 4 * ~~(days / 1461);
      days %= 1461;
      if (days > 365) {
        jy += ~~((days - 1) / 365);
        days = (days - 1) % 365;
      }
      const jm = days < 186 ? 1 + ~~(days / 31) : 7 + ~~((days - 186) / 30);
      const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
      return [jy, jm, jd];
    }

    function jalaliToGregorian(jy, jm, jd) {
      jy += 1595;
      let days = -355668 + (365 * jy) + (~~(jy / 33) * 8) + ~~(((jy % 33) + 3) / 4) + jd + (jm < 7 ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
      let gy = 400 * ~~(days / 146097);
      days %= 146097;
      if (days > 36524) {
        gy += 100 * ~~(--days / 36524);
        days %= 36524;
        if (days >= 365) days++;
      }
      gy += 4 * ~~(days / 1461);
      days %= 1461;
      if (days > 365) {
        gy += ~~((days - 1) / 365);
        days = (days - 1) % 365;
      }
      let gd = days + 1;
      const sal_a = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      let gm;
      for (gm = 0; gm < 13 && gd > sal_a[gm]; gm++) gd -= sal_a[gm];
      return [gy, gm, gd];
    }

    function isJalaliLeap(jy) {
      const [gy, gm, gd] = jalaliToGregorian(jy, 12, 30);
      const [jy2, jm2, jd2] = gregorianToJalali(gy, gm, gd);
      return jy2 === jy && jm2 === 12 && jd2 === 30;
    }

    function jalaliMonthLength(jy, jm) {
      if (jm <= 6) return 31;
      if (jm <= 11) return 30;
      return isJalaliLeap(jy) ? 30 : 29;
    }

    function jalaliIranToTimestamp(jy, jm, jd, hh, mm) {
      const [gy, gm, gd] = jalaliToGregorian(jy, jm, jd);
      return Date.UTC(gy, gm - 1, gd, hh, mm, 0) - IRAN_OFFSET_MS;
    }

    function timestampToJalaliIran(ts) {
      const d = new Date(ts + IRAN_OFFSET_MS);
      const [jy, jm, jd] = gregorianToJalali(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
      return {
        jy, jm, jd,
        hh: d.getUTCHours(),
        mm: d.getUTCMinutes(),
        ss: d.getUTCSeconds(),
        dow: d.getUTCDay()
      };
    }

    function toFaDigits(str) {
      return String(str).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function formatJalaliDateTime(ts) {
      const t = timestampToJalaliIran(ts);
      return `${toFaDigits(t.jd)} ${JALALI_MONTHS[t.jm - 1]} ${toFaDigits(t.jy)} • ${toFaDigits(pad2(t.hh))}:${toFaDigits(pad2(t.mm))}`;
    }

    function formatCountdown(targetTs, status) {
      if (status === 'done') return { text: 'تکمیل شده', cls: 'finished' };
      const diff = targetTs - Date.now();
      if (diff <= 0) {
        const passedMin = Math.floor(Math.abs(diff) / 60000);
        if (passedMin < 60) return { text: `${toFaDigits(passedMin || 1)} دقیقه از موعد گذشته`, cls: 'overdue' };
        const passedHr = Math.floor(passedMin / 60);
        if (passedHr < 24) return { text: `${toFaDigits(passedHr)} ساعت از موعد گذشته`, cls: 'overdue' };
        return { text: `${toFaDigits(Math.floor(passedHr / 24))} روز از موعد گذشته`, cls: 'overdue' };
      }
      const totalMin = Math.floor(diff / 60000);
      const days = Math.floor(totalMin / 1440);
      const hours = Math.floor((totalMin % 1440) / 60);
      const mins = totalMin % 60;
      const parts = [];
      if (days > 0) parts.push(`${toFaDigits(days)} روز`);
      if (hours > 0) parts.push(`${toFaDigits(hours)} ساعت`);
      if (days === 0 && mins > 0) parts.push(`${toFaDigits(mins)} دقیقه`);
      if (!parts.length) parts.push('کمتر از ۱ دقیقه');
      return { text: `${parts.join(' و ')} باقی‌مانده`, cls: '' };
    }

    // ================== State ==================
    const STORAGE_KEY = 'iran_study_planner_clean_v1';
    let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let currentTab = 'homework';
    let chartMode = 'subjects';

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    // ================== Date/Time Selectors ==================
    function populateDateTimeSelectors() {
      const nowIran = timestampToJalaliIran(Date.now());
      const ySel = document.getElementById('dueYear');
      const mSel = document.getElementById('dueMonth');
      const dSel = document.getElementById('dueDay');
      const hSel = document.getElementById('dueHour');
      const minSel = document.getElementById('dueMin');

      ySel.innerHTML = '';
      for (let y = nowIran.jy - 1; y <= nowIran.jy + 4; y++) {
        ySel.innerHTML += `<option value="${y}">${toFaDigits(y)}</option>`;
      }

      mSel.innerHTML = '';
      JALALI_MONTHS.forEach((name, idx) => {
        mSel.innerHTML += `<option value="${idx + 1}">${name}</option>`;
      });

      hSel.innerHTML = '';
      for (let h = 0; h < 24; h++) {
        hSel.innerHTML += `<option value="${h}">ساعت ${toFaDigits(pad2(h))}</option>`;
      }

      minSel.innerHTML = '';
      for (let m = 0; m < 60; m++) {
        minSel.innerHTML += `<option value="${m}">دقیقه ${toFaDigits(pad2(m))}</option>`;
      }

      function updateDays() {
        const y = parseInt(ySel.value, 10);
        const m = parseInt(mSel.value, 10);
        const prev = parseInt(dSel.value, 10) || 1;
        const maxD = jalaliMonthLength(y, m);
        dSel.innerHTML = '';
        for (let d = 1; d <= maxD; d++) {
          dSel.innerHTML += `<option value="${d}">${toFaDigits(d)}</option>`;
        }
        dSel.value = Math.min(prev, maxD);
      }

      ySel.addEventListener('change', updateDays);
      mSel.addEventListener('change', updateDays);
      updateDays();
    }

    function setDueSelector(ts) {
      const t = timestampToJalaliIran(ts);
      const ySel = document.getElementById('dueYear');
      const mSel = document.getElementById('dueMonth');
      const dSel = document.getElementById('dueDay');
      ySel.value = t.jy;
      mSel.value = t.jm;
      mSel.dispatchEvent(new Event('change'));
      dSel.value = t.jd;
      document.getElementById('dueHour').value = t.hh;
      document.getElementById('dueMin').value = t.mm;
    }

    function getDueTimestamp() {
      return jalaliIranToTimestamp(
        parseInt(document.getElementById('dueYear').value, 10),
        parseInt(document.getElementById('dueMonth').value, 10),
        parseInt(document.getElementById('dueDay').value, 10),
        parseInt(document.getElementById('dueHour').value, 10),
        parseInt(document.getElementById('dueMin').value, 10)
      );
    }

    // ================== Clock ==================
    function updateIranClock() {
      const t = timestampToJalaliIran(Date.now());
      document.getElementById('iranTime').textContent = `${toFaDigits(pad2(t.hh))}:${toFaDigits(pad2(t.mm))}:${toFaDigits(pad2(t.ss))}`;
      document.getElementById('iranDate').textContent = `${PERSIAN_DAYS[t.dow]} ${toFaDigits(t.jd)} ${JALALI_MONTHS[t.jm - 1]} ${toFaDigits(t.jy)} • ایران`;
    }

    // ================== Charts ==================
    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    function renderCharts(tabItems, hwItems, exItems) {
      const total = tabItems.length;
      const done = tabItems.filter(i => i.status === 'done').length;
      const prog = tabItems.filter(i => i.status === 'in_progress').length;
      const todo = tabItems.filter(i => i.status === 'todo').length;

      document.getElementById('donutScopeLabel').textContent = currentTab === 'homework' ? 'آمار بخش تکالیف' : 'آمار بخش امتحانات';
      document.getElementById('statTotalBadge').textContent = `کل: ${toFaDigits(total)}`;
      document.getElementById('statDone').textContent = toFaDigits(done);
      document.getElementById('statProgress').textContent = toFaDigits(prog);
      document.getElementById('statTodo').textContent = toFaDigits(todo);

      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById('donutPercent').textContent = `${toFaDigits(pct)}٪`;

      const C = 2 * Math.PI * 48;
      const segDone = document.getElementById('segDone');
      const segProg = document.getElementById('segProgress');
      const segTodo = document.getElementById('segTodo');

      if (!total) {
        segDone.setAttribute('stroke-dasharray', `0 ${C}`);
        segProg.setAttribute('stroke-dasharray', `0 ${C}`);
        segTodo.setAttribute('stroke-dasharray', `0 ${C}`);
      } else {
        const lenDone = (done / total) * C;
        const lenProg = (prog / total) * C;
        const lenTodo = (todo / total) * C;

        segDone.setAttribute('stroke-dasharray', `${lenDone} ${C}`);
        segDone.setAttribute('stroke-dashoffset', '0');

        segProg.setAttribute('stroke-dasharray', `${lenProg} ${C}`);
        segProg.setAttribute('stroke-dashoffset', `${-lenDone}`);

        segTodo.setAttribute('stroke-dasharray', `${lenTodo} ${C}`);
        segTodo.setAttribute('stroke-dashoffset', `${-(lenDone + lenProg)}`);
      }

      const container = document.getElementById('barChartContainer');
      if (chartMode === 'subjects') {
        const map = {};
        tabItems.forEach(item => {
          const sub = item.subject.trim() || 'بدون نام';
          if (!map[sub]) map[sub] = { total: 0, done: 0, prog: 0, todo: 0 };
          map[sub].total++;
          if (item.status === 'done') map[sub].done++;
          else if (item.status === 'in_progress') map[sub].prog++;
          else map[sub].todo++;
        });

        const entries = Object.entries(map).sort((a, b) => b[1].total - a[1].total).slice(0, 5);
        if (!entries.length) {
          container.innerHTML = `<div class="bar-empty">با ثبت ${currentTab === 'homework' ? 'تکلیف' : 'امتحان'}، نمودار تفکیک دروس اینجا نمایش داده می‌شود.</div>`;
          return;
        }

        const maxTotal = Math.max(...entries.map(e => e[1].total), 1);
        container.innerHTML = entries.map(([sub, s]) => {
          const wDone = (s.done / maxTotal) * 100;
          const wProg = (s.prog / maxTotal) * 100;
          const wTodo = (s.todo / maxTotal) * 100;
          const subPct = Math.round((s.done / s.total) * 100);
          return `
            <div class="bar-row">
              <div class="bar-meta">
                <span>${escapeHtml(sub)}</span>
                <span class="muted">${toFaDigits(s.done)} از ${toFaDigits(s.total)} تکمیل (${toFaDigits(subPct)}٪)</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill" style="width:${wDone}%; background:var(--done);"></div>
                <div class="bar-fill" style="width:${wProg}%; background:var(--progress);"></div>
                <div class="bar-fill" style="width:${wTodo}%; background:var(--todo);"></div>
              </div>
            </div>
          `;
        }).join('');
      } else {
        const groups = [
          { label: 'کل تکالیف', arr: hwItems, color: 'var(--primary)' },
          { label: 'کل امتحانات', arr: exItems, color: 'var(--exam)' }
        ];
        const maxVal = Math.max(hwItems.length, exItems.length, 1);
        container.innerHTML = groups.map(g => {
          const totalG = g.arr.length;
          const doneG = g.arr.filter(i => i.status === 'done').length;
          const pctG = totalG ? Math.round((doneG / totalG) * 100) : 0;
          const wTotal = (totalG / maxVal) * 100;
          return `
            <div class="bar-row">
              <div class="bar-meta">
                <span>${g.label}</span>
                <span class="muted">${toFaDigits(doneG)} تکمیل شده از ${toFaDigits(totalG)} مورد (${toFaDigits(pctG)}٪)</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill" style="width:${wTotal}%; background:${g.color};"></div>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    // ================== Render UI ==================
    function render() {
      const hwItems = items.filter(i => i.type === 'homework');
      const exItems = items.filter(i => i.type === 'exam');

      document.getElementById('countHomework').textContent = toFaDigits(hwItems.length);
      document.getElementById('countExam').textContent = toFaDigits(exItems.length);
      document.getElementById('subHomework').textContent = `${toFaDigits(hwItems.filter(i => i.status === 'done').length)} مورد تکمیل شده`;
      document.getElementById('subExam').textContent = `${toFaDigits(exItems.filter(i => i.status === 'done').length)} مورد تکمیل شده`;

      const tabItems = currentTab === 'homework' ? hwItems : exItems;
      renderCharts(tabItems, hwItems, exItems);

      const addBtn = document.getElementById('addItemBtn');
      addBtn.textContent = currentTab === 'homework' ? 'افزودن تکلیف جدید' : 'افزودن امتحان جدید';
      addBtn.classList.toggle('exam-mode', currentTab === 'exam');

      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      const sortBy = document.getElementById('sortSelect').value;

      let filtered = tabItems.filter(item => {
        if (statusFilter !== 'all' && item.status !== statusFilter) return false;
        if (q && !`${item.title} ${item.subject} ${item.desc}`.toLowerCase().includes(q)) return false;
        return true;
      });

      const prioRank = { high: 3, medium: 2, low: 1 };
      filtered.sort((a, b) => {
        if (sortBy === 'dueAsc') return a.dueTs - b.dueTs;
        if (sortBy === 'priority') return prioRank[b.priority] - prioRank[a.priority];
        return b.createdAt - a.createdAt;
      });

      const grid = document.getElementById('itemsGrid');
      if (!filtered.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>موردی در بخش ${currentTab === 'homework' ? 'تکالیف' : 'امتحانات'} ثبت نشده است</h3>
            <p style="font-size:0.84rem;">برای شروع روی دکمه افزودن کلیک کنید.</p>
          </div>
        `;
        return;
      }

      const prioLabel = { high: 'فوری', medium: 'مهم', low: 'عادی' };

      grid.innerHTML = filtered.map(item => {
        const cd = formatCountdown(item.dueTs, item.status);
        return `
          <div class="item-card status-${item.status} type-${item.type}">
            <div class="card-top">
              <div>
                <span class="subject-tag">${escapeHtml(item.subject)}</span>
                <div class="card-title">${escapeHtml(item.title)}</div>
              </div>
              <span class="priority-pill priority-${item.priority}">${prioLabel[item.priority]}</span>
            </div>

            ${item.desc ? `<div class="card-desc">${escapeHtml(item.desc)}</div>` : ''}

            <div class="meta-box">
              <div class="meta-row">
                <span class="k">موعد (وقت ایران):</span>
                <span class="v">${formatJalaliDateTime(item.dueTs)}</span>
              </div>
              <div class="countdown ${cd.cls}">${cd.text}</div>
            </div>

            <div class="status-switcher">
              <button class="status-btn ${item.status === 'todo' ? 'active-todo' : ''}" onclick="setStatus('${item.id}', 'todo')">انجام نشده</button>
              <button class="status-btn ${item.status === 'in_progress' ? 'active-in_progress' : ''}" onclick="setStatus('${item.id}', 'in_progress')">در حال انجام</button>
              <button class="status-btn ${item.status === 'done' ? 'active-done' : ''}" onclick="setStatus('${item.id}', 'done')">انجام شد</button>
            </div>

            <div class="card-actions">
              <button class="mini-btn" onclick="openEditModal('${item.id}')">ویرایش</button>
              <button class="mini-btn danger" onclick="deleteItem('${item.id}')">حذف</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ================== CRUD ==================
    window.setStatus = function(id, status) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.status = status;
      saveItems();
      render();
    };

    window.deleteItem = function(id) {
      items = items.filter(i => i.id !== id);
      saveItems();
      render();
    };

    const itemModal = document.getElementById('itemModal');

    function openAddModal() {
      document.getElementById('editId').value = '';
      document.getElementById('itemForm').reset();
      document.getElementById('itemType').value = currentTab;
      document.getElementById('modalTitle').textContent = currentTab === 'homework' ? 'افزودن تکلیف جدید' : 'افزودن امتحان جدید';
      setDueSelector(Date.now() + 2 * 3600 * 1000);
      itemModal.classList.add('open');
    }

    window.openEditModal = function(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      document.getElementById('editId').value = item.id;
      document.getElementById('itemType').value = item.type;
      document.getElementById('itemSubject').value = item.subject;
      document.getElementById('itemTitle').value = item.title;
      document.getElementById('itemDesc').value = item.desc || '';
      document.getElementById('itemStatus').value = item.status;
      document.getElementById('itemPriority').value = item.priority;
      document.getElementById('modalTitle').textContent = item.type === 'homework' ? 'ویرایش تکلیف' : 'ویرایش امتحان';
      setDueSelector(item.dueTs);
      itemModal.classList.add('open');
    };

    function closeModal() {
      itemModal.classList.remove('open');
    }

    document.getElementById('addItemBtn').addEventListener('click', openAddModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

    document.getElementById('itemForm').addEventListener('submit', e => {
      e.preventDefault();
      const editId = document.getElementById('editId').value;
      const type = document.getElementById('itemType').value;

      const data = {
        id: editId || ('id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7)),
        type,
        subject: document.getElementById('itemSubject').value.trim(),
        title: document.getElementById('itemTitle').value.trim(),
        desc: document.getElementById('itemDesc').value.trim(),
        status: document.getElementById('itemStatus').value,
        priority: document.getElementById('itemPriority').value,
        dueTs: getDueTimestamp(),
        createdAt: Date.now()
      };

      if (editId) {
        const idx = items.findIndex(i => i.id === editId);
        if (idx !== -1) {
          data.createdAt = items[idx].createdAt;
          items[idx] = data;
        }
      } else {
        items.push(data);
      }

      currentTab = type;
      syncTabButtons();
      saveItems();
      render();
      closeModal();
    });

    // ================== Tabs, Charts, Filters & Theme ==================
    function syncTabButtons() {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === currentTab);
      });
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTab = btn.dataset.tab;
        syncTabButtons();
        render();
      });
    });

    document.getElementById('modeSubjects').addEventListener('click', () => {
      chartMode = 'subjects';
      document.getElementById('modeSubjects').classList.add('active');
      document.getElementById('modeCompare').classList.remove('active');
      render();
    });

    document.getElementById('modeCompare').addEventListener('click', () => {
      chartMode = 'compare';
      document.getElementById('modeCompare').classList.add('active');
      document.getElementById('modeSubjects').classList.remove('active');
      render();
    });

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('statusFilter').addEventListener('change', render);
    document.getElementById('sortSelect').addEventListener('change', render);

    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');

    function updateThemeIcon(isDark) {
      themeIcon.innerHTML = isDark
        ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
        : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    }

    if (localStorage.getItem('planner_theme') === 'dark') {
      document.body.classList.add('dark');
      updateThemeIcon(true);
    }

    themeBtn.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark');
      localStorage.setItem('planner_theme', isDark ? 'dark' : 'light');
      updateThemeIcon(isDark);
    });

    // ================== Init ==================
    populateDateTimeSelectors();
    updateIranClock();
    render();

    setInterval(updateIranClock, 1000);
    setInterval(render, 30000);
  </script>
</body>
</html>
