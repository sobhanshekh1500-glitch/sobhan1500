name: Build HTML to APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare web files
        run: |
          mkdir -p www
          for item in *; do
            if [ "$item" != "www" ]; then
              cp -r "$item" www/
            fi
          done

      - name: Setup Capacitor and Android
        run: |
          rm -f package.json package-lock.json capacitor.config.json capacitor.config.ts
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "MyApp" "com.example.myapp" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-html-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
